name: Stop EKS Cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev2

env:
  INFRA_OWNER: your-org
  INFRA_REPO: infra-rds

jobs:
  trigger-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger Stop Workflow
        id: trigger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_PAT }}
          script: |
            const owner = '${{ env.INFRA_OWNER }}';
            const repo = '${{ env.INFRA_REPO }}';
            const workflow_id = 'eks-rds-${{ inputs.environment }}-scheduler.yml';
            const triggerTime = new Date();

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: 'main',
              inputs: { action: 'stop' }
            });

            console.log(`Triggered stop workflow at ${triggerTime.toISOString()}`);
            await new Promise(resolve => setTimeout(resolve, 5000));

            let runId = null;
            for (let i = 0; i < 10; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, per_page: 5
              });
              const newRun = runs.data.workflow_runs.find(run =>
                new Date(run.created_at) >= triggerTime
              );
              if (newRun) {
                runId = newRun.id;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }

            if (!runId) throw new Error('Could not find triggered workflow run');
            core.setOutput('run_id', runId);
            core.setOutput('run_url', `https://github.com/${owner}/${repo}/actions/runs/${runId}`);

      - name: Wait for Workflow Completion
        id: wait
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_PAT }}
          script: |
            const owner = '${{ env.INFRA_OWNER }}';
            const repo = '${{ env.INFRA_REPO }}';
            const runId = ${{ steps.trigger.outputs.run_id }};

            console.log(`Monitoring: ${{ steps.trigger.outputs.run_url }}`);

            let status = 'queued';
            let conclusion = null;

            while (['queued', 'in_progress', 'waiting'].includes(status)) {
              await new Promise(resolve => setTimeout(resolve, 30000));
              const run = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runId
              });
              status = run.data.status;
              conclusion = run.data.conclusion;
              console.log(`Status: ${status}${conclusion ? ` (${conclusion})` : ''}`);
            }

            core.setOutput('conclusion', conclusion);

      - name: Fetch Workflow Summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_PAT }}
          script: |
            const owner = '${{ env.INFRA_OWNER }}';
            const repo = '${{ env.INFRA_REPO }}';
            const runId = ${{ steps.trigger.outputs.run_id }};

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId
            });

            console.log('\n======== STOP CLUSTER SUMMARY ========\n');
            for (const job of jobs.data.jobs) {
              const icon = job.conclusion === 'success' ? '✅' :
                          job.conclusion === 'failure' ? '❌' : '⏭️';
              console.log(`${icon} ${job.name}: ${job.conclusion || job.status}`);
            }
            console.log(`\nFull logs: ${{ steps.trigger.outputs.run_url }}`);

      - name: Report Result
        if: always()
        run: |
          echo "## Stop Cluster Result" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.wait.outputs.conclusion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Logs | [View](${{ steps.trigger.outputs.run_url }}) |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.wait.outputs.conclusion }}" != "success" ]; then
            exit 1
          fi
