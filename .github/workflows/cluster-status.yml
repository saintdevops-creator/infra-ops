name: Cluster Status

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev2

env:
  INFRA_OWNER: your-org
  INFRA_REPO: infra-rds

jobs:
  trigger-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Status Check
        id: trigger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_PAT }}
          script: |
            const owner = '${{ env.INFRA_OWNER }}';
            const repo = '${{ env.INFRA_REPO }}';
            const workflow_id = 'eks-rds-${{ inputs.environment }}-scheduler.yml';
            const triggerTime = new Date();

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id,
              ref: 'main',
              inputs: { action: 'status' }
            });

            console.log(`Triggered status check for ${{ inputs.environment }}`);
            await new Promise(resolve => setTimeout(resolve, 5000));

            let runId = null;
            for (let i = 0; i < 10; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, per_page: 5
              });
              const newRun = runs.data.workflow_runs.find(run =>
                new Date(run.created_at) >= triggerTime
              );
              if (newRun) {
                runId = newRun.id;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }

            if (!runId) throw new Error('Could not find triggered workflow run');
            core.setOutput('run_id', runId);
            core.setOutput('run_url', `https://github.com/${owner}/${repo}/actions/runs/${runId}`);

      - name: Wait and Fetch Status
        id: wait
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_PAT }}
          script: |
            const owner = '${{ env.INFRA_OWNER }}';
            const repo = '${{ env.INFRA_REPO }}';
            const runId = ${{ steps.trigger.outputs.run_id }};

            let status = 'queued';
            let conclusion = null;

            while (['queued', 'in_progress', 'waiting'].includes(status)) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const run = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runId
              });
              status = run.data.status;
              conclusion = run.data.conclusion;
            }

            core.setOutput('conclusion', conclusion);

            // Try to fetch logs for status job
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId
            });

            const statusJob = jobs.data.jobs.find(j => j.name.includes('status'));
            if (statusJob) {
              try {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner, repo, job_id: statusJob.id
                });

                // Parse and display relevant status info
                const logText = logs.data;
                console.log('\n======== CLUSTER STATUS ========\n');

                // Extract key status lines
                const lines = logText.split('\n');
                for (const line of lines) {
                  if (line.includes('VPC:') ||
                      line.includes('EKS:') ||
                      line.includes('RDS:') ||
                      line.includes('NAT Gateway:') ||
                      line.includes('Status:') ||
                      line.includes('Nodes:') ||
                      line.includes('ACTIVE') ||
                      line.includes('NOT RUNNING') ||
                      line.includes('Ready')) {
                    console.log(line.replace(/^\d{4}-\d{2}-\d{2}T[\d:\.Z]+\s*/, '').trim());
                  }
                }
              } catch (e) {
                console.log('Could not fetch detailed logs. Check the workflow run for details.');
              }
            }

            console.log(`\nFull status: ${{ steps.trigger.outputs.run_url }}`);

      - name: Report Result
        if: always()
        run: |
          echo "## Cluster Status Check" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check Status | ${{ steps.wait.outputs.conclusion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Details | [View Full Status](${{ steps.trigger.outputs.run_url }}) |" >> $GITHUB_STEP_SUMMARY
